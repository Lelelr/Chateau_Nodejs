<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un château</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <!----------------------------- ZONE CONTENU------------------------------>
    <div class="container mt-5">
        <!-- Bouton retour -->
        <a href="index.html" class="btn btn-secondary mb-3">Retour</a>

        <!-- Titre -->
        <h1 class="text-center mb-4">Ajouter un nouveau château</h1>

        <!-- Formulaire -->
        <form id="chateauForm">

            <!-- NOM CHÂTEAU -->
            <div class="mb-3">
                <label for="nom" class="form-label">Nom du château</label>
                <input type="text" class="form-control" id="nom" required>
            </div>

            <!-- TYPE -->
            <div class="mb-3">
                <label for="type" class="form-label">Type</label>
                <input type="text" class="form-control" id="type" placeholder="Château / Manoir" required>
            </div>

            <!-- STYLE -->
            <div class="mb-3">
                <label for="style" class="form-label">Style</label>
                <input type="text" class="form-control" id="style" placeholder="Classique, Renaissance, ..." required>
            </div>

            <!-- ANNÉE -->
            <div class="mb-3">
                <label for="date_construction" class="form-label">Année de construction</label>
                <input type="text" class="form-control" id="date_construction" placeholder="Ex: 1682">
            </div>

            <!-- SURFACE -->
            <div class="mb-3">
                <label for="surface" class="form-label">Surface (m²)</label>
                <input type="number" class="form-control" id="surface" placeholder="Ex: 2000">
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Description du château..."></textarea>
            </div>

            <!-- STATUT -->
            <div class="mb-3">
                <label for="statut" class="form-label">Statut</label>
                <input type="text" class="form-control" id="statut" placeholder="Ex: Habité">
            </div>

            <!-- PRIX -->
            <div class="mb-3">
                <label for="prix" class="form-label">Prix (€)</label>
                <input type="number" class="form-control" id="prix" placeholder="Ex: 1500000">
            </div>

            <!-- BOUTON -->
            <button type="submit" class="btn btn-primary w-100">Créer le château</button>
        </form>

        <!-- Zone pour afficher le résultat de la requête -->
        <div id="result" class="mt-4"></div>
    </div>

    *

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



    <!-------------------------------- SCRIPT -------------------------------->
    <script>
        // Récuperer le formulaire dans la page
        const form = document.getElementById('chateauForm');

        // Récuperer le toast Bootstrap
        const toast = document.getElementById('liveToast');
        const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toast);



        // Quand on soumet le formulaire : ----------------------------------------
        form.addEventListener('submit', async (e) => {
            
            // Empêcher le rechargement automatique de la page
            e.preventDefault();

            // Créer un objet "data" avec les valeurs du formulaire
            const data = {
                nom: document.getElementById('nom').value,
                type: document.getElementById('type').value,
                style: document.getElementById('style').value,
                date_construction: document.getElementById('date_construction').value,
                surface: Number(document.getElementById('surface').value),
                description: document.getElementById('description').value,
                statut: document.getElementById('statut').value,
                prix: Number(document.getElementById('prix').value)
            };

            try {
                // Envoyer les données au backend avec une requête HTTP POST
                const response = await fetch('http://localhost:3000/api/chateaux', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }, // envoie du JSON
                    body: JSON.stringify(data) // convertir objet JS en texte JSON
                });

                // Convertir réponse backend en JSON
                const result = await response.json();



                // Si OK :
                if (response.ok) {
                    // Reset du formulaire
                    form.reset();

                    // Redirection vers page d'accueil avec paramètre toast
                    window.location.href = "index.html?toast=success_chateau";

                } else {
                    // Si erreur
                    alert("Erreur : " + (result.error || "Impossible de créer le château"));
                }



            } catch (error) {
                // Si la requête a échoué
                console.error("Erreur :", error);
                alert("Erreur lors de l’envoi : " + error.message);
            }
        });
    </script>
</body>
</html>
