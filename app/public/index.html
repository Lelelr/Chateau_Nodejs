<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <!-------------------------------- HEADER -------------------------------->
    <div class="container text-center mt-5">
        <h1 class="mb-4">Bienvenue dans l'univers des châteaux !</h1>
        <p class="mb-5">Choisissez une action :</p>
    </div>


    <!-------------------------------- BOUTONS ------------------------------->
    <div class="container my-4">
        <div class="row justify-content-center g-4">

            <!-- Ajouter château-->
            <div class="col-md-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <i class="bi bi-building" style="font-size: 2rem;"></i>
                        <h5 class="card-title mt-2">Ajouter un château</h5>
                        <a href="chateau.html" class="btn btn-primary mt-3">Ajouter</a>
                    </div>
                </div>
            </div>

            <!-- Ajouter Propriétaire -->
            <div class="col-md-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <i class="bi bi-person" style="font-size: 2rem;"></i>
                        <h5 class="card-title mt-2">Ajouter un propriétaire</h5>
                        <a href="proprietaire.html" class="btn btn-success mt-3">Ajouter</a>
                    </div>
                </div>
            </div>

            <!-- Ajouter collection -->
            <div class="col-md-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <i class="bi bi-box-seam" style="font-size: 2rem;"></i>
                        <h5 class="card-title mt-2">Ajouter une collection</h5>
                        <a href="collection.html" class="btn btn-warning mt-3">Ajouter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-------------------------------- LISTE --------------------------------->
    <div class="container my-5">
        <h3>Liste des châteaux</h3>
        <div id="chateauxList" class="list-group mb-5"></div>

        <h3>Liste des propriétaires</h3>
        <div id="proprietairesList" class="list-group mb-5"></div>

        <h3>Liste des collections</h3>
        <div id="collectionsList" class="list-group mb-5"></div>
    </div>







    <!-- Toast Propriétaire -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToastChateau" class="toast text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
            <div class="d-flex justify-content-center">
                <div class="toast-body text-center">
                    Château créé avec succès !
                </div>
            </div>
        </div>
    </div>


    <!-- Toast Propriétaire -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToastProprietaire" class="toast text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
            <div class="d-flex justify-content-center">
                <div class="toast-body text-center">
                    Propriétaire créé avec succès !
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>











    <!----------------------------- SCRIPT TOAST ----------------------------->
    <script>
    // Exécution une fois au chargement de la page
    document.addEventListener('DOMContentLoaded', () => {

        const url = new URL(window.location);
        const toastParam = url.searchParams.get('toast');

        // Affichage du toast selon le paramètre
        if (toastParam === 'success_chateau') {
            const toastEl = document.getElementById('liveToastChateau');
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        if (toastParam === 'success_proprietaire') {
            const toastEl = document.getElementById('liveToastProprietaire');
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        // Supprimer le paramètre de l’URL après l’affichage
        if (toastParam) {
            url.searchParams.delete('toast');
            window.history.replaceState({}, '', url);
        }
    });
    </script>





    <!-------------------------------- SCRIPT -------------------------------->

    <script>
    async function fetchData() {
        try {
            // ----------------------------------- Châteaux -----------------------------------
            // Récupérer la liste des châteaux par l'API
            const resChateaux = await fetch('http://localhost:3000/api/chateaux');

            // Convertir la réponse en tableau JS
            const chateaux = await resChateaux.json();

            // Récupérer l'élément ul qui doit afficher la liste
            const chateauxList = document.getElementById('chateauxList');


            // Vider la liste avant de la remplir
            chateauxList.innerHTML = '';

            // Créer un <li> pour chaque château
            chateaux.forEach(chateau => {

                // Créer la ligne
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                // Créer un span "info" avec les informations du château
                const info = document.createElement('span');
                info.textContent = `${chateau.nom} (${chateau.type})`;

                // Créer une div "actions"
                const actions = document.createElement('div');

                // Icône Voir
                const viewIcon = document.createElement('i');
                viewIcon.className = 'bi bi-eye me-3';
                viewIcon.style.cursor = 'pointer';
                viewIcon.title = "Voir";
                // redirection vers la page de détails
                viewIcon.onclick = () => {
                    window.location.href = `chateau_details.html?id=${chateau._id}`;
                };

                // Icône Modifier
                const editIcon = document.createElement('i');
                editIcon.className = 'bi bi-pencil-square me-3';
                editIcon.style.cursor = 'pointer';
                editIcon.title = "Modifier";
                // Redirection vers la page d'édition
                editIcon.onclick = () => {
                    window.location.href = `edit_chateau.html?id=${chateau._id}`;
                };

                // Icône Supprimer
                const deleteIcon = document.createElement('i');
                deleteIcon.className = 'bi bi-x-circle';
                deleteIcon.style.cursor = 'pointer';
                deleteIcon.title = "Supprimer";
                deleteIcon.onclick = async () => {
                    // Confirmation avant suppression
                    if (confirm("Supprimer ce château ?")) {

                        // Appel DELETE vers l'API
                        await fetch(`http://localhost:3000/api/chateaux/${chateau._id}`, {
                            method: 'DELETE'
                        });

                        // Recharger la page pour mettre à jour la liste
                        window.location.reload();
                    }
                };

                // Ajouter les icônes dans la zone "actions"
                actions.appendChild(viewIcon);
                actions.appendChild(editIcon);
                actions.appendChild(deleteIcon);

                // Assemble <li>
                li.appendChild(info);       // ajoute le span dans le li
                li.appendChild(actions);    // ajoute les icônes dans le li

                // Ajouter <li> dans la liste générale des châteaux
                chateauxList.appendChild(li);
            });
            



            // --------------------------------- Propriétaire ---------------------------------
            // Récupérer la liste des propriétaires par l'API
            const resProprietaires = await fetch('http://localhost:3000/api/proprietaire');

            // Convertir la réponse en tableau JSON
            const proprietaires = await resProprietaires.json();

            // Récupérer l'élément ul qui doit afficher la liste
            const proprietairesList = document.getElementById('proprietairesList');


            // Vider la liste avant de la remplir
            proprietairesList.innerHTML = '';

            // Créer un <li> pour chaque château
            proprietaires.forEach(p => {

                // Création du LI
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                // Créer un span "info" avec les informations du propriétaire
                const info = document.createElement('span');
                info.textContent = `${p.prenom} ${p.nom}`;

                // Créer une div "actions"
                const actions = document.createElement('div');

                // Icône Voir
                const viewIcon = document.createElement('i');
                viewIcon.className = 'bi bi-eye me-3';
                viewIcon.style.cursor = 'pointer';
                viewIcon.title = "Voir";
                viewIcon.onclick = () => {
                    window.location.href = `proprietaire_details.html?id=${p._id}`;
                };

                // Icône Modifier
                const editIcon = document.createElement('i');
                editIcon.className = 'bi bi-pencil-square me-3';
                editIcon.style.cursor = 'pointer';
                editIcon.title = "Modifier";
                editIcon.onclick = () => {
                    window.location.href = `edit_proprietaire.html?id=${p._id}`;
                };

                // Icône upprimer
                const deleteIcon = document.createElement('i');
                deleteIcon.className = 'bi bi-x-circle';
                deleteIcon.style.cursor = 'pointer';
                deleteIcon.title = "Supprimer";
                deleteIcon.onclick = async () => {
                    // Confirmation avant suppression
                    if (confirm("Supprimer ce propriétaire ?")) {

                        // Appel DELETE vers l'API
                        await fetch(`http://localhost:3000/api/proprietaire/${p._id}`, {
                            method: 'DELETE'
                        });

                        // Recharger la page pour mettre à jour la liste
                        window.location.reload();
                    }
                };

                // Ajouter les icônes dans la zone "actions"
                actions.appendChild(viewIcon);
                actions.appendChild(editIcon);
                actions.appendChild(deleteIcon);


                // Assemble <li>
                li.appendChild(info);       // ajoute le span dans le li
                li.appendChild(actions);    // ajoute les icônes dans le li

                // Ajoute <li> dans la liste générale
                proprietairesList.appendChild(li);
            });




            // ---------------------------------- Collection ----------------------------------
            // Récupérer la liste des collections par l'API
            const resCollections = await fetch('http://localhost:3000/api/collections');

            // Convertir la réponse en tableau JSON
            const collections = await resCollections.json();

            // Récupérer l'élément ul qui doit afficher la liste
            const collectionsList = document.getElementById('collectionsList');



            // Vider la liste avant de la remplir
            collectionsList.innerHTML = '';

            // Créer un <li> pour chaque château
            collections.forEach(col => {

                // Création du LI
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                // Créer un span "info" avec les informations de la collection
                const info = document.createElement('span');
                info.textContent = `${col.name} ( ${col.chateaux.length} châteaux )`;

                // Créer une div "actions"
                const actions = document.createElement('div');

                // Icône Modifier
                const editIcon = document.createElement('i');
                editIcon.className = 'bi bi-pencil-square me-3';
                editIcon.style.cursor = 'pointer';
                editIcon.title = "Modifier";
                editIcon.onclick = () => {
                    window.location.href = `edit_collection.html?id=${col._id}`;
                };

                // Icône Supprimer
                const deleteIcon = document.createElement('i');
                deleteIcon.className = 'bi bi-x-circle';
                deleteIcon.style.cursor = 'pointer';
                deleteIcon.title = "Supprimer";
                deleteIcon.onclick = async () => {
                    // Confirmation avant suppression
                    if (confirm("Supprimer cette collection ?")) {

                        // Appel DELETE vers l'API
                        await fetch(`http://localhost:3000/api/collections/${col._id}`, {
                            method: 'DELETE'
                        });

                        // Recharger la page pour mettre à jour la liste
                        window.location.reload();
                    }
                };

                // Ajouter les icônes dans la zone "actions"
                actions.appendChild(editIcon);
                actions.appendChild(deleteIcon);

                // Assemble <li>
                li.appendChild(info);
                li.appendChild(actions);

                // Ajoute <li> dans la liste générale
                collectionsList.appendChild(li);
            });


        } catch (error) {
            console.error('Erreur lors de la récupération des données :', error);
        }
    }

    // Appel pour afficher les données
    fetchData();
    </script>



</body>
</html>
