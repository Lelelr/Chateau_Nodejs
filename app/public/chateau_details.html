<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails du château</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <!----------------------------- ZONE CONTENU------------------------------>
    <div class="container mt-5">
        <!-- Bouton retour -->
        <a href="index.html" class="btn btn-secondary mb-3">Retour</a>

        <!-- Titre -->
        <h1 class="mb-4 text-center">Détails du château</h1>

        <!-- Zone d'affichage des informations du château -->
        <div id="infoChateau"></div>
    </div>



    <!-------------------------------- SCRIPT -------------------------------->
    <script>
        // Récupérer les paramètres de l'URL
        const params = new URLSearchParams(window.location.search);

        // Éxtrairel'ID du château
        const chateauId = params.get("id");

        // Charger les informations du château
        async function loadChateau() {

            // Récupérer les informations du château
            const response = await fetch(`http://localhost:3000/api/chateaux/${chateauId}`);

            // Convertir la réponse en JSON
            const c = await response.json();



            // Si aucun château trouvé ou si erreur -----------------------------------
            if (!c || c.error) {
                document.getElementById("infoChateau").innerHTML =
                    `<div class="alert alert-danger">Château introuvable.</div>`;
                return;
            }



            // Si OK : construire & afficher la carte Bootstrap
            document.getElementById("infoChateau").innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <!-- Nom du château -->
                        <h3 class="card-title mb-3">${c.nom}</h3> 

                        <!-- Type du château -->
                        <p><strong>Type :</strong> ${c.type}</p>

                        <!-- Style du château -->
                        <p><strong>Style :</strong> ${c.style}</p>

                        <!-- Année construction du château -->
                        <p><strong>Année de construction :</strong> ${c.date_construction}</p>

                        <!-- Surface du château -->
                        <p><strong>Surface :</strong> ${c.surface} m²</p>

                        <!-- Statut du château -->
                        <p><strong>Statut :</strong> ${c.statut}</p>

                        <!-- Prix du château -->
                        <p><strong>Prix :</strong> ${c.prix} €</p>

                        <!-- Description du château -->
                        <p><strong>Description :</strong> ${c.description || 'Aucune description.'}</p>
                    </div>
                </div>
            `;
        }

        loadChateau();
    </script>

</body>
</html>
